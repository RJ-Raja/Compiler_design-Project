<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team RS Compiler</title>
    <style>
        /* Light Blue Theme CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e3f2fd; /* Light blue background */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            border-top: 5px solid #2196f3; /* Primary blue accent */
        }

        h1 {
            color: #1565c0;
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .toggle-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #1976d2;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #bbdefb;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        input[type="file"] {
            display: block;
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #2196f3;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            background-color: #f1f8e9;
        }

        button {
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1976d2;
        }

        .output-group {
            margin-top: 30px;
        }

        .output-box {
            background-color: #1e1e1e; /* Dark terminal look */
            color: #4caf50; /* Hacker green text */
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            height: 300px;
            overflow-y: auto;
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Natural Language to C++ Compiler</h1>
        <p class="subtitle">Built by Team RS</p>

        <div class="input-group">
            <div class="toggle-container">
                <label>
                    <input type="radio" name="inputType" value="text" checked onchange="toggleInput()"> Type Text
                </label>
                <label>
                    <input type="radio" name="inputType" value="file" onchange="toggleInput()"> Upload .txt File
                </label>
            </div>

            <div id="textInputDiv">
                <textarea id="codeInput" placeholder="Enter your controlled English code here...&#10;Example:&#10;Create integer x.&#10;Set x to 10."></textarea>
            </div>

            <div id="fileInputDiv" style="display: none;">
                <input type="file" id="fileInput" accept=".txt">
            </div>
        </div>

        <button onclick="runCompiler()">Generate Code</button>

        <div class="output-group">
            <label>Compiler Output Pipeline:</label>
            <div id="outputTerminal" class="output-box">Waiting for input...</div>
        </div>
    </div>

    <script>
        // Toggle between Text Box and File Upload
        function toggleInput() {
            const isText = document.querySelector('input[name="inputType"]:checked').value === 'text';
            document.getElementById('textInputDiv').style.display = isText ? 'block' : 'none';
            document.getElementById('fileInputDiv').style.display = isText ? 'none' : 'block';
        }

        // Main function triggered when the button is clicked
        async function runCompiler() {
            const outputTerminal = document.getElementById('outputTerminal');
            let sourceCode = "";
            const isText = document.querySelector('input[name="inputType"]:checked').value === 'text';

            // 1. Get the text based on the selected method
            if (isText) {
                sourceCode = document.getElementById('codeInput').value;
            } else {
                const fileInput = document.getElementById('fileInput');
                if (fileInput.files.length === 0) {
                    outputTerminal.innerHTML = "<span style='color: #f44336;'>Error: Please select a file first.</span>";
                    return;
                }
                const file = fileInput.files[0];
                sourceCode = await file.text(); // Read file content
            }

            if (!sourceCode.trim()) {
                outputTerminal.innerHTML = "<span style='color: #f44336;'>Error: Input is empty.</span>";
                return;
            }

            // 2. Simulate the C++ Backend Output
            // (Later, this is where you will send 'sourceCode' to your C++ backend via an API or Node.js)
            outputTerminal.innerHTML = "Starting Team RS C++ Compiler...\n\n";
            
            setTimeout(() => {
                outputTerminal.innerHTML += "--- RAW ENGLISH INPUT ---\n" + sourceCode + "\n-------------------------\n\n";
            }, 500);

            setTimeout(() => {
                outputTerminal.innerHTML += ">>> Running Lexical Analyzer...\n";
                outputTerminal.innerHTML += "=== TOKEN STREAM ===\n[Type: 0, Value: 'Create'] [Type: 1, Value: 'integer'] [Type: 12, Value: 'x'] [Type: 14, Value: '.'] ...\n====================\n\n";
            }, 1000);

            setTimeout(() => {
                outputTerminal.innerHTML += ">>> Running Parser...\n";
                outputTerminal.innerHTML += "=== ABSTRACT SYNTAX TREE ===\n  [VarDeclNode] Create int -> x\n  [AssignmentNode] Set x = 10\n============================\n\n";
                outputTerminal.innerHTML += "Compilation Pipeline Finished Successfully.";
            }, 1500);
        }
    </script>

</body>
</html>
