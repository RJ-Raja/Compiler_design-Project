<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Language to C++ Compiler</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #e6f2ff;
            --button-hover: #004494;
            --terminal-bg: #121212;
            --terminal-text: #00ff00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-blue);
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 86, 179, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-blue);
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        h2 {
            color: #555;
            margin: 0;
            font-weight: 400;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .input-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .input-controls label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 2px solid #cce5ff;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .file-upload {
            display: none;
            text-align: center;
            padding: 40px;
            border: 2px dashed #cce5ff;
            border-radius: 8px;
            background-color: #f8fbff;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .terminal {
            background-color: var(--terminal-bg);
            color: var(--terminal-text);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin-top: 30px;
            border-radius: 8px;
            min-height: 200px;
            white-space: pre-wrap;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Natural Language to C++ Compiler</h1>
            <h2>Team RS</h2>
        </header>

        <div class="input-controls">
            <span id="in" style="color: #666; font-size: 1rem; display: flex; align-items: center;">Input: </span>
            <label>
                <input type="radio" name="inputType" value="text" checked> Type Code
            </label>
            <label>
                <input type="radio" name="inputType" value="file"> Upload .txt File
            </label>
        </div>

        <div class="input-controls" style="margin-top: -10px;">
            <span style="color: #666; font-size: 1rem; display: flex; align-items: center;">Output:</span>
            <label>
                <input type="radio" name="outputType" value="code" checked> Only Code
            </label>
            <label>
                <input type="radio" name="outputType" value="file"> Get File (.cpp)
            </label>
        </div>

        <div class="input-area">
            <textarea id="textInput" placeholder="Enter your natural language commands here...&#10;e.g., create integer x&#10;SET x to 10&#10;print x"></textarea>
            <div class="file-upload" id="fileInputContainer">
                <input type="file" id="fileInput" accept=".txt">
                <p>Select a .txt file containing your natural language code.</p>
            </div>
        </div>

        <button id="generateBtn">Generate Code</button>

        <div class="terminal" id="terminalOutput">Compiler initialized. Waiting for input...</div>
    </div>

    <script>
        // DOM Elements
        const radioText = document.querySelector('input[value="text"]');
        const radioFile = document.querySelector('input[value="file"]');
        const radioOutputCode = document.querySelector('input[name="outputType"][value="code"]');
        const radioOutputFile = document.querySelector('input[name="outputType"][value="file"]');
        const textInput = document.getElementById('textInput');
        const fileInputContainer = document.getElementById('fileInputContainer');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const terminalOutput = document.getElementById('terminalOutput');

        // Toggle between Text Area and File Upload
        function toggleInputMode() {
            if (radioText.checked) {
                textInput.style.display = 'block';
                fileInputContainer.style.display = 'none';
            } else {
                textInput.style.display = 'none';
                fileInputContainer.style.display = 'block';
            }
        }

        radioText.addEventListener('change', toggleInputMode);
        radioFile.addEventListener('change', toggleInputMode);

        // Helper function to read file content
        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject("Error reading file.");
                reader.readAsText(file);
            });
        }

        // Handle Generate Code Button Click
        generateBtn.addEventListener('click', async () => {
            let sourceCode = "";

            // Gather input based on selected mode
            if (radioText.checked) {
                sourceCode = textInput.value.trim();
                if (!sourceCode) {
                    terminalOutput.textContent = "> Error: Text input is empty. Please enter some code.";
                    return;
                }
            } else {
                if (!fileInput.files.length) {
                    terminalOutput.textContent = "> Error: No file selected. Please upload a .txt file.";
                    return;
                }
                try {
                    sourceCode = await readFileContent(fileInput.files[0]);
                } catch (err) {
                    terminalOutput.textContent = "> " + err;
                    return;
                }
            }

            // Display loading message in the terminal
            terminalOutput.textContent = "> Sending to compiler...\n> Awaiting compilation pipeline results...";

            // Fetch request to the backend
            try {
                const outputMode = radioOutputFile.checked ? 'file' : 'code';
                const response = await fetch('/api/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: sourceCode, outputMode: outputMode })
                });

                const data = await response.json();

                // Handle the response and display in terminal
                if (response.ok) {
                    const compiledCode = data.output || "No output returned.";
                    terminalOutput.textContent = "> Compilation Successful!\n\n" + compiledCode;
                    
                    // Trigger file download if requested
                    if (radioOutputFile.checked && data.output) {
                        const blob = new Blob([compiledCode], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'output.cpp';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        terminalOutput.textContent += "\n\n> Download triggered for output.cpp";
                    }
                } else {
                    terminalOutput.style.color = "#ff5555"; // Red text for errors
                    terminalOutput.textContent = "> Compilation Failed.\n\n" + (data.error || "Unknown server error occurred.");
                    setTimeout(() => terminalOutput.style.color = "var(--terminal-text)", 3000); // Reset color after 3s
                }
            } catch (error) {
                terminalOutput.style.color = "#ff5555";
                terminalOutput.textContent = "> Network Error: Could not connect to the compiler backend.\n> Please ensure your Node server is running.";
                setTimeout(() => terminalOutput.style.color = "var(--terminal-text)", 3000);
            }
        });
    </script>
</body>
</html>
